<?xml version="1.0" encoding="UTF-8"?>
<!-- OVERSHOT OS mark: an arrow overshooting a bracket. Original work. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0f0"/>
      <stop offset="1" stop-color="#3a7bd5"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0d1117"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#1f2933" stroke-width="2"/>
  <!-- bracket -->
  <path d="M72 28 v14 a6 6 0 0 1 -6 6 h-8 a6 6 0 0 0 -6 6 v20 a6 6 0 0 0 6 6 h8 a6 6 0 0 1 6 6 v14"
        fill="none" stroke="#c9d1d9" stroke-width="8" stroke-linecap="round"/>
  <!-- overshoot arrow -->
  <line x1="46" y1="84" x2="98" y2="42" stroke="url(#cy)" stroke-width="8" stroke-linecap="round"/>
  <path d="M76 38 h24 v24" fill="none" stroke="url(#cy)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
