# OVERSHOT OS — cava config for the Waybar visualizer module.
# Raw mode: 12 unsigned 8-bit samples per frame, written to stdout.
# Consumed by /usr/local/share/overshot/scripts/waybar-cava.

[general]
bars = 12
framerate = 30
autosens = 1

[smoothing]
noise_reduction = 40

[output]
method = raw
raw_target = /dev/stdout
bit_format = 8bit
