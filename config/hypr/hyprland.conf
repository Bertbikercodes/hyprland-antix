# OVERSHOT OS — Hyprland main config
# Edit freely; updates never overwrite this file (see docs/customization.md).

source = ./theme.conf
source = ./keybinds.conf

monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        disable_while_typing = true
    }
}

env = XCURSOR_SIZE, 24

# subtle glass effect on the top panel only (kept cheap: 3px, 2 passes)
layerrule = blur, overshot-top

# ── session autostart ────────────────────────────────────────────────
exec-once = swaybg -i /usr/local/share/overshot/assets/overshot-wallpaper.png -m fill
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = waybar -c ~/.config/waybar/dock.jsonc -s ~/.config/waybar/dock.css
exec-once = dunst

# user overrides last so they win (perf mode writes here)
source = ~/.config/hypr/user-overrides.conf
