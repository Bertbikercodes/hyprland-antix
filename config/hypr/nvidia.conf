# OVERSHOT OS — NVIDIA-specific Hyprland settings
# This file is enabled/disabled automatically by overshot-gpu:
# the 'source = nvidia.conf' line in hyprland.conf exists ONLY on systems
# where a proprietary NVIDIA driver is installed. Remove the source line
# (or run 'overshot-gpu repair') to disable it — nothing else to undo.

env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# NVIDIA + Hyprland: software cursors avoid invisible-cursor glitches
cursor {
    no_hardware_cursors = true
}
