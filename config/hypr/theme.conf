# OVERSHOT OS — theme (colors, gaps, decoration, animations)
# Performance mode (overshot-perf) disables animations/blur via user-overrides.conf.

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(95d0f0ee)
    col.inactive_border = rgba(58,70,82aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95
    shadow {
        enabled = true
        range = 15
        render_power = 2
        color = rgba(0d1117cc)
    }
    blur {
        enabled = true
        size = 3
        passes = 2
        xray = false
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.9, 0.25, 1.0
    animation = windows, 1, 5, smooth, popin 85%
    animation = windowsOut, 1, 4, smooth, popin 85%
    animation = fade, 1, 5, smooth
    animation = workspaces, 1, 6, smooth
    animation = border, 1, 8, default
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 0
}

dwindle {
    pseudotile = true
    preserve_split = true
}
