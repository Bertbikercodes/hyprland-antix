# hyprland-antix — default config
# English (US) keyboard = the standard Windows layout.
# $mainMod = the Windows key (called "SUPER" here).

monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 5
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ── key bindings (mainMod = Windows key) ─────────────────────────
$mainMod = SUPER

bind = $mainMod, Return, exec, foot          # open terminal
bind = $mainMod, Q, killactive               # close window
bind = $mainMod, M, exit                     # quit Hyprland (back to console)
bind = $mainMod, F, fullscreen
bind = $mainMod, Space, togglefloating
bind = $mainMod, B, exec, pkill -f waybar || waybar   # bar on/off

# focus windows with Windows + arrows
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# switch workspaces with Windows + 1..5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# move window to workspace with Windows + Shift + 1..5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# ── autostart ─────────────────────────────────────────────────────
exec-once = waybar

env = XCURSOR_SIZE, 24
